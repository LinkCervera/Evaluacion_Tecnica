<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Denegado - Sistema Castores</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #E31E24 0%, #8B0000 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .error-container {
      background: white;
      padding: 50px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 500px;
    }

    .error-icon {
      font-size: 80px;
      margin-bottom: 20px;
    }

    h1 {
      color: #E31E24;
      font-size: 32px;
      margin-bottom: 15px;
    }

    p {
      color: #666;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .btn-home {
      display: inline-block;
      padding: 12px 30px;
      background: linear-gradient(135deg, #E31E24 0%, #C01717 100%);
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(227, 30, 36, 0.4);
    }
  </style>
</head>
<body>
<div class="error-container">
  <div class="error-icon">🚫</div>
  <h1>Acceso Denegado</h1>
  <p>No tienes permisos para acceder a esta sección del sistema. Por favor contacta al administrador si crees que esto es un error.</p>
  <a href="/home" class="btn-home">Volver al Inicio</a>
</div>
</body>
</html>
