<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Sistema de Inventario Castores</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #E31E24 0%, #8B0000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #E31E24;
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .logo p {
            color: #333;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #E31E24;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #E31E24 0%, #C01717 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(227, 30, 36, 0.4);
            background: linear-gradient(135deg, #C01717 0%, #E31E24 100%);
        }

        .alert {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-error {
            background-color: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background-color: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .info-box {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 15px;
            margin-top: 20px;
        }

        .info-box h3 {
            color: #495057;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .info-box p {
            color: #6c757d;
            font-size: 12px;
            margin: 5px 0;
        }

        .info-box code {
            background-color: #e9ecef;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="logo">
        <h1>SISTEMA DE INVENTARIO</h1>
        <p>CASTORES 2025</p>
    </div>

    <!-- Mensaje de error -->
    <div th:if="${error}" class="alert alert-error">
        <span th:text="${error}">Error</span>
    </div>

    <!-- Mensaje de éxito -->
    <div th:if="${message}" class="alert alert-success">
        <span th:text="${message}">Mensaje</span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn-login">Iniciar Sesión</button>
    </form>

    <!-- Información de usuarios de prueba -->
    <div class="info-box">
        <h3>👥 Usuarios de Prueba</h3>
        <p><strong>Administrador:</strong> <code>admin</code> / <code>admin123</code></p>
        <p><strong>Almacenista:</strong> <code>almacenista</code> / <code>almacen123</code></p>
    </div>
</div>
</body>
</html>
